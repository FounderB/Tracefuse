# Clean CI — pull_request only; no remote shell pipes; secrets via Actions expressions
name: demo-clean-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      # Uses Actions secrets expression — should not trip plaintext detectors
      TOKEN: ${{ secrets.DEMO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
