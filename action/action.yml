name: Tracefuse Scan
description: Offline supply-chain / pipeline truth scanner (declared vs real). Emits SARIF.
author: FounderB

branding:
  icon: shield
  color: orange

inputs:
  path:
    description: Path to scan
    required: false
    default: "."
  fail-on:
    description: Fail when findings at or above this severity exist
    required: false
    default: high
  sarif-path:
    description: Where to write the SARIF 2.1.0 report
    required: false
    default: tracefuse.sarif
  quiet:
    description: Suppress human banner (true/false)
    required: false
    default: "true"
  git-diff:
    description: Only scan files changed vs HEAD (true/false)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Tracefuse
      shell: bash
      run: cargo install --path "${{ github.action_path }}/.." --locked --force

    - name: Run Tracefuse
      shell: bash
      env:
        TF_PATH: ${{ inputs.path }}
        TF_SARIF: ${{ inputs.sarif-path }}
        TF_FAIL_ON: ${{ inputs.fail-on }}
        TF_QUIET: ${{ inputs.quiet }}
        TF_GIT_DIFF: ${{ inputs.git-diff }}
      run: |
        set -euo pipefail
        # Validate fail-on against allowlist (never interpolate raw into arbitrary flags)
        case "${TF_FAIL_ON}" in
          info|low|medium|high|critical) ;;
          *) echo "invalid fail-on: ${TF_FAIL_ON}"; exit 2 ;;
        esac
        QFLAG=()
        if [ "${TF_QUIET}" = "true" ]; then QFLAG+=(-q); fi
        GFLAG=()
        if [ "${TF_GIT_DIFF}" = "true" ]; then GFLAG+=(--git-diff); fi
        # Paths as argv — env-sourced, not string-interpolated into a shell script body
        tracefuse scan "${TF_PATH}" \
          --sarif "${TF_SARIF}" \
          --fail-on "${TF_FAIL_ON}" \
          "${QFLAG[@]}" \
          "${GFLAG[@]}"

    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-path }}
        category: tracefuse
