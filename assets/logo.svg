<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Tracefuse">
  <defs>
    <linearGradient id="ember" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F5B942"/>
      <stop offset="55%" stop-color="#E07A2F"/>
      <stop offset="100%" stop-color="#C43C12"/>
    </linearGradient>
    <linearGradient id="trace" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F5B942" stop-opacity="0"/>
      <stop offset="35%" stop-color="#F5B942"/>
      <stop offset="100%" stop-color="#E07A2F"/>
    </linearGradient>
  </defs>
  <!-- charcoal plate -->
  <rect width="128" height="128" rx="22" fill="#141414"/>
  <rect x="4" y="4" width="120" height="120" rx="18" fill="none" stroke="#2A2A2A" stroke-width="2"/>
  <!-- fuse body -->
  <rect x="28" y="58" width="52" height="12" rx="3" fill="#3A3A3A"/>
  <rect x="28" y="58" width="52" height="12" rx="3" fill="url(#trace)" opacity="0.85"/>
  <!-- tip / burn -->
  <path d="M78 52 L98 40 L102 48 L88 64 L98 72 L78 76 Z" fill="url(#ember)"/>
  <!-- spark -->
  <circle cx="100" cy="44" r="4" fill="#FFE6A8"/>
  <circle cx="108" cy="38" r="2.2" fill="#F5B942" opacity="0.9"/>
  <!-- trace tick marks -->
  <path d="M34 64 H70" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/>
</svg>
